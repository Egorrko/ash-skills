# Build the release image, prove it boots, publish it. Copied by /ash-bootstrap to
# .github/workflows/image.yml.
#
# CI is where the image is proved: a local build depends on the network to Hex, npm and
# the base image registry. The image is pushed only after its migrations ran and /health
# answered against a throwaway PostgreSQL.
#
# Registry: GHCR by default (ghcr.io/<owner>/<repo>, the built-in GITHUB_TOKEN). Another
# registry: change IMAGE and the login step, the credentials as repository secrets.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Every variable runtime.exs requires, with a throwaway value: the boot check
      # fails on the first one missing. Carry new ones over from .env.example.
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/<APP>_ci
      SECRET_KEY_BASE: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
      PHX_HOST: localhost
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        # registry paths are lowercase; the repository name may not be
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrations
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e SECRET_KEY_BASE -e PHX_HOST -e PORT \
            "$IMAGE:$GITHUB_SHA" /app/bin/migrate

      - name: Boot and /health
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL -e SECRET_KEY_BASE -e PHX_HOST -e PORT \
            "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:$PORT/health" && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
